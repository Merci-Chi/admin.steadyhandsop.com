<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#102945" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Steady Hands Admin" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="192x192" href="images/icon-192.png" />
  <title>Sales Associates • Steady Hands Admin</title>
  <link rel="stylesheet" href="styles.css?v=20261009-dark-text-popup-v8" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="theme.js?v=20261005-account-theme"></script>
</head>
<body class="page-admin-users">
<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div>
        <span class="admin-kicker">STEADY HANDS ADMIN</span>
        <h1>Sales Associates</h1>
      </div>
    </div>
  </header>

  <main class="content admin-users-content">
    <section class="salesperson-create-head"><div><h2>Team accounts</h2><p>Create a sales associate login with a @steadyhandsop.com email. Account creation requires the secure server function.</p></div><button type="button" id="salespersonCreateToggle">+ New associate</button></section>
    <section id="salespersonCreatePanel" class="salesperson-create-panel" hidden><form id="salespersonCreateForm">
      <label>Display name<input id="newSalespersonName" required maxlength="100" autocomplete="off"></label>
      <label>Username<input id="newSalespersonUsername" required placeholder="firstname.lastname" autocomplete="off"><small>@steadyhandsop.com</small></label>
      <label>Temporary password<input id="newSalespersonPassword" type="password" required autocomplete="new-password"></label>
      <button type="submit">Create associate account</button><p id="salespersonCreateResult" role="status"></p>
    </form></section>
    <section class="admin-user-toolbar">
      <div class="admin-user-search">
        <i data-lucide="search"></i>
        <input id="adminUserSearch" type="search" placeholder="Search name, email, phone…" autocomplete="off" />
      </div>
      <button type="button" id="adminUserRefresh" aria-label="Refresh users"><i data-lucide="refresh-cw"></i></button>
    </section>

    <section class="admin-user-filters" id="adminUserFilters">
      <button class="active" data-user-filter="all">All</button>
      <button data-user-filter="active">Active</button>
      <button data-user-filter="disabled">Disabled</button>
      
    </section>

    <section class="admin-user-summary" id="adminUserSummary"></section>
    <section class="admin-user-list" id="adminUserList"><div class="cc-empty">Loading sales associates…</div></section>
  </main>

  <nav class="bottom-nav"></nav>
</div>

<div class="admin-user-drawer-overlay" id="adminUserDrawerOverlay" hidden>
  <aside class="admin-user-drawer" id="adminUserDrawer"></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js?v=20261005-admin-only"></script>
<script src="admin-shell.js?v=20261019-associate-phones"></script>
<script src="sales-associate-data.js?v=20261018"></script>
<script src="associate-overview.js?v=20261018"></script>
<script src="admin-users.js?v=20261018-associate-overview"></script>
<script src="admin-salespeople-tools.js?v=20261018-associate-links"></script>
</body>
</html>
