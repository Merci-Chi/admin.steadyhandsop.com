<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102945"><title>Other Actions • Steady Hands Admin</title><link rel="stylesheet" href="styles.css?v=20261018"><link rel="stylesheet" href="associate-pages.css?v=20261018"><script src="https://unpkg.com/lucide@latest"></script><script src="theme.js"></script></head><body class="page-admin-users"><div class="app"><header class="topbar"><div class="topbar-row"><div><span class="admin-kicker">SALES ASSOCIATES</span><h1>Other Actions</h1><p class="client-header-sub">Assign questionnaires and review every available outcome.</p></div></div></header><main class="content admin-users-content"><section class="sa-panel"><h2>Assign a questionnaire</h2><p>Assign a simple popup questionnaire to one associate. They answer one question at a time in Outreach → Action Needed.</p><form id="oa-form"><div class="sa-assign-grid"><label for="oa-user">Associate<select id="oa-user" required disabled><option value="">Loading associates…</option></select></label><label for="oa-basis">Current agreement<select id="oa-basis" required><option value="">Choose agreement</option><option value="hourly">Hourly wage</option><option value="commission">Commission</option></select></label><label for="oa-date">Scheduled start date<input id="oa-date" type="date"><span class="sa-start-help">Required for hourly associates. Monday–Friday only.</span></label></div><div class="sa-form-footer"><button class="primary" type="submit" id="oa-assign" disabled>Assign questionnaire</button><p id="oa-message" role="status" aria-live="polite"></p></div></form></section><section class="sa-panel"><h2>Outcomes</h2><div class="sa-filter-row"><label for="oa-search">Search<input id="oa-search" type="search" placeholder="Name, email, path or timezone"></label><label for="oa-filter">Show<select id="oa-filter"><option value="all">All outcomes</option><opti
