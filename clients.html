<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102945"><link rel="manifest" href="manifest.webmanifest"><title>Clients • Steady Hands Admin</title><link rel="stylesheet" href="styles.css?v=20261009-admin-dark-coverage6"><script src="https://unpkg.com/lucide@latest"></script><script src="theme.js?v=20261005-account-theme"></script></head>
<body class="page-admin-users page-admin-clients"><div class="app"><header class="topbar"><div class="topbar-row"><div><span class="admin-kicker">STEADY HANDS ADMIN</span><h1>Clients</h1><p class="client-header-sub">Manage your clients, their websites, hosting, and support.</p></div><div class="client-header-actions"><button id="convertClient" type="button" class="client-btn secondary"><i data-lucide="arrow-left-right"></i> Convert Lead to Client</button><button id="newClient" type="button" class="client-btn primary"><i data-lucide="plus"></i> New Client</button></div></div></header>
<main class="content client-content">
 <div class="client-search"><i data-lucide="search"></i><input id="clientSearch" type="search" placeholder="Search clients by company name, contact, or domain…" autocomplete="off"></div>
 <div class="client-filter-bar"><div class="client-chips">
 <button class="active" data-client-filter="all">All Clients <span id="count-all">0</span></button>
 <button data-client-filter="active">Active <span id="count-active">0</span></button>
 <button data-client-filter="onboarding">Onboarding <span id="count-onboarding">0</span></button>
 <button data-client-filter="live">Live <span id="count-live">0</span></button>
 <button data-client-filter="needs_review">Needs Review <span id="count-needs_review">0</span></button>
 <button data-client-filter="past_due">Past Due <span id="count-past_due">0</span></button></div>
 <div class="client-selects"><select id="clientHosting" aria-label="Filter hosting"><option value="all">All Hosting Plans</option><option value="standard">Standard Hosting</option><option value="backend">Backend Hosting</option><option value="none">No Hosting</option></select><select id="clientTeam" aria-label="Filter assigned team"><option value="all">All Team Members</option></select></div></div>
 <p id="clientDataNotice" role="status" class="client-notice"></p>
 <div class="client-table-scroll"><table class="client-table"><thead><tr><th>Company</th><th>Contact</th><th>Site Status</th><th>Hosting</th><th>Agreement</th><th>Assigned To</th><th>Last Request</th><th>Actions</th></tr></thead><tbody id="clientList"><tr><td colspan="8">Loading clients…</td></tr></tbody></table></div>
 <div class="client-footer"><span id="clientSummary">Loading clients…</span><div class="client-pages"><button id="clientPrev" aria-label="Previous page">‹</button><span id="clientPageCount">1 / 1</span><button id="clientNext" aria-label="Next page">›</button></div></div>
</main><nav class="bottom-nav"></nav></div>
<div class="admin-request-overlay" id="clientOverlay" hidden><aside class="admin-request-drawer" id="clientDrawer" aria-label="Client details"></aside></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="auth-guard.js?v=20261005-admin-only"></script><script src="admin-shell.js?v=20261009-independent-scroll-v3"></script><script src="admin-clients.js?v=20261009-client-table"></script></body></html>
