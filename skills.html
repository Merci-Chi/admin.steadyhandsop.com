<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#102945" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Steady Hands Admin" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="192x192" href="images/icon-192.png" />
  <title>Skills • Steady Hands Admin</title>
  <link rel="stylesheet" href="styles.css?v=20261005-admin-batch9" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="theme.js?v=20261005-account-theme"></script>
</head>
<body class="page-admin-skills">
<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div>
        <span class="admin-kicker">STEADY HANDS ADMIN</span>
        <h1>Skills</h1>
      </div>
    </div>
  </header>

  <main class="content admin-skills-content">
    <section class="admin-skills-toolbar">
      <div class="admin-user-search">
        <i data-lucide="search"></i>
        <input id="adminSkillsSearch" type="search" placeholder="Search team member…" autocomplete="off" />
      </div>
      <select id="adminSkillsRange">
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="all">All time</option>
      </select>
      <button type="button" id="adminAssignSkill"><i data-lucide="target"></i><span>Direct Skill</span></button>
    </section>

    <section class="admin-skills-summary" id="adminSkillsSummary">
      <div><strong>—</strong><span>Calls reviewed</span></div>
      <div><strong>—</strong><span>Team average</span></div>
      <div><strong>—</strong><span>Assignments</span></div>
      <div><strong>—</strong><span>Completed</span></div>
    </section>

    <section class="admin-dashboard-section">
      <div class="admin-dashboard-head">
        <div><span class="admin-kicker">TEAM</span><h2>Skill Scores</h2></div>
      </div>
      <div class="admin-skill-team-list" id="adminSkillTeamList"><div class="cc-empty">Loading team skills…</div></div>
    </section>

    <section class="admin-dashboard-section">
      <div class="admin-dashboard-head">
        <div><span class="admin-kicker">DIRECT SKILLS</span><h2>Assigned Coaching</h2></div>
        <span class="admin-list-count" id="adminDirectSkillCount">0</span>
      </div>
      <div class="admin-direct-skills-list" id="adminDirectSkillsList"><div class="cc-empty">Loading assignments…</div></div>
    </section>
  </main>

  <nav class="bottom-nav"></nav>
</div>

<div class="admin-skill-drawer-overlay" id="adminSkillDrawerOverlay" hidden>
  <aside class="admin-skill-drawer" id="adminSkillDrawer"></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js?v=20261005-admin-only"></script>
<script src="admin-shell.js?v=20261007-requests-sidebar2"></script>
<script src="admin-skills.js?v=20261005-batch5"></script>
</body>
</html>
