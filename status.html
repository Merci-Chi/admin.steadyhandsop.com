<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102945"><title>Status • Steady Hands Admin</title><link rel="stylesheet" href="styles.css?v=20261018"><link rel="stylesheet" href="associate-pages.css?v=20261018"><link rel="stylesheet" href="status.css?v=20261018"><script src="https://unpkg.com/lucide@latest"></script><script src="theme.js"></script></head>
<body class="page-admin-users page-associate-status"><div class="app"><header class="topbar"><div class="topbar-row"><div><span class="admin-kicker">SALES ASSOCIATES</span><h1>Status</h1><p class="client-header-sub">Track each associate’s next steps and completed milestones.</p></div></div></header>
<main class="content admin-users-content"><section class="sa-panel"><h2>Associate status</h2><div class="sa-filter-row"><label for="status-search">Search associates<input type="search" id="status-search" placeholder="Name or email"></label><button type="button" id="status-refresh">Refresh</button></div><p id="status-notice" role="status" aria-live="polite">Loading associates…</p><div id="status-list"></div></section></main><nav class="bottom-nav"></nav></div>
<dialog id="status-dialog" aria-labelledby="status-name"><div class="status-dialog-head"><div><span class="admin-kicker">ASSOCIATE STATUS</span><h2 id="status-name"></h2></div><button type="button" id="status-close" aria-label="Close status">✕</button></div><p id="status-progress"></p><form id="status-add"><label for="status-title">Add a checklist item</label><div class="status-add-row"><input id="status-title" maxlength="500" required placeholder="Enter one next step…"><button class="primary" type="submit">+ Add</button></div></form><p id="status-message" role="status" aria-live="polite"></p><h3>Checklist</h3><div id="status-items"></div><details id="status-history-panel"><summary>History</summary><p>Completed items and all checklist changes, newest first.</p><div id="status-history"></div></details></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="auth-guard.js"></script><script src="admin-shell.js?v=20261019-performance"></script><script src="sales-associate-data.js?v=20261018"></script><script src="status.js?v=20261018"></script></body></html>
