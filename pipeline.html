<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Pipeline • Steady Hands Admin</title><link rel="stylesheet" href="styles.css"><script src="https://unpkg.com/lucide@latest"></script><script src="theme.js"></script><style>.pipeline-admin-wrap{max-width:1250px;margin:auto;padding:24px}.pipeline-admin-bar{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.pipeline-admin-bar input,.pipeline-admin-bar select,.pipeline-admin-row select{background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:11px;color:#14284d;min-width:180px}.pipeline-admin-grid{display:grid;gap:12px}.pipeline-admin-row{background:white;border-radius:15px;padding:18px;display:grid;gap:10px;box-shadow:0 4px 16px #10294510}.pipeline-admin-row header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pipeline-admin-row p{margin:0;color:#5b6a84}.pipeline-admin-row button{background:#146dd1;color:white;border:0;border-radius:10px;padding:11px;cursor:pointer}.pipeline-admin-counters{display:flex;flex-wrap:wrap;gap:10px}.pipeline-admin-counters span{background:#e8f3ff;color:#14284d;border-radius:10px;padding:12px}#adminPipelineMessage{color:#294d76}html[data-theme="dark"] .pipeline-admin-row{background:#102438;color:#edf5ff;border:1px solid #314b65;box-shadow:0 4px 16px #0004}html[data-theme="dark"] .pipeline-admin-row :is(header,strong,h3){color:#edf5ff}html[data-theme="dark"] .pipeline-admin-row p{color:#b4c9df}html[data-theme="dark"] .pipeline-admin-counters span{background:#173653;color:#edf5ff}html[data-theme="dark"] .pipeline-admin-bar :is(input,select),html[data-theme="dark"] .pipeline-admin-row select{background:#0a1d30;color:#edf5ff;border-color:#39536d}html[data-theme="dark"] #adminPipelineMessage{color:#bdd2e7}</style></head><body><div class="app"><header class="topbar"><div class="topbar-row"><div><span class="admin-kicker">STEADY HANDS ADMIN</span><h1>Sales Pipeline</h1></div></div></header><main class="content"><div class="pipeline-admin-wrap"><h2>Team pipeline</h2><p>Live stages and follow-up categories for assigned salespeople. Only active team members should have access.</p><div class="pipeline-admin-bar"><select id="pipelineAdminUser"><option value="">All salespeople</option></select><select id="pipelineAdminStage"><option value="">All stages</option></select><select id="pipelineAdminCategory"><option value="">All follow-up categories</option></select><input id="pipelineAdminSearch" type="search" placeholder="Search company, contact or phone"><button id="pipelineAdminRefresh" type="button">Refresh</button></div><div id="pipelineAdminCounters" class="pipeline-admin-counters"></div><p id="adminPipelineMessage" role="status">Loading…</p><div id="pipelineAdminList" class="pipeline-admin-grid"></div></div></main><nav class="bottom-nav"></nav></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="auth-guard.js"></script><script src="admin-shell.js?v=20261019-performance"></script><script src="admin-pipeline.js"></script></body></html>
