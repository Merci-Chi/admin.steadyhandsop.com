<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a56"><title>Sign In | Steady Hands Admin</title>
<link rel="icon" href="https://onboard.steadyhandsop.com/images/logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="192x192" href="images/icon-192.png">
<link rel="stylesheet" href="login-onboard.css?v=20261010-admin-login-v1">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="app-update.js?v=20261005-admin-batch9" defer></script>
</head><body>
<div class="auth-layout">
<section class="brand-side">
<a class="brand-link" href="https://steadyhandsop.com"><img class="brand-logo" src="https://onboard.steadyhandsop.com/images/logo.png" alt=""><img class="brand-wordmark" src="https://onboard.steadyhandsop.com/images/wordmark-white.png" alt="Steady Hands"></a>
<div class="brand-copy"><p class="eyebrow">STEADY HANDS ADMINISTRATION</p><h1>We run the site.<span class="tagline-art" role="img" aria-label="You run the show."></span></h1><p>Manage your team, clients, requests, and operations from one secure workspace.</p></div>
<img class="wave" src="https://onboard.steadyhandsop.com/images/background.jpg" alt="">
</section>
<main class="auth-side"><div class="auth-card">
<div class="mobile-brand"><img src="https://onboard.steadyhandsop.com/images/logo.png" alt=""> Steady Hands</div>
<p class="eyebrow">YOUR WORKSPACE</p>
<h2 id="loginHeading">Welcome back</h2>
<p id="loginSubheading" class="sub">Sign in to access your Steady Hands Admin.</p>
<form id="loginForm" class="login-form">
<label for="loginEmail">Email address</label><input id="loginEmail" type="email" name="email" placeholder="you@company.com" autocomplete="username" required>
<label for="loginPassword">Password</label><div class="password-wrap"><input id="loginPassword" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required><button id="showPassword" type="button" aria-label="Show password">Show</button></div>
<div class="outreach-login-options">
<label class="outreach-check-label"><input type="checkbox" id="saveEmailToDevice"><span class="outreach-check-box" aria-hidden="true">✓</span><span>Save email to this device</span></label>
<label class="outreach-check-label terms-option" for="agreeToTerms"><input id="agreeToTerms" type="checkbox"><span class="outreach-check-box" aria-hidden="true">✓</span><span>I agree to the <a href="terms.html" id="termsLink">Terms &amp; Conditions</a>.</span></label>
<div class="terms-validation" id="termsValidation" role="alert">This box must be checked to continue.</div>
<div id="loginMessage" class="login-message" role="status" aria-live="polite"></div>
</div>
<button type="submit" id="signInButton" class="primary-button full outreach-login-submit">Sign in <span aria-hidden="true">→</span></button>
<button type="button" id="forgotPassword" class="text-btn outreach-forgot">Forgot password?</button>
</form><p class="foot outreach-login-foot">Administrator access only</p>
</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="login.js?v=20261005-admin-batch9"></script>
</body></html>
