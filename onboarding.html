<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102945"><title>Onboarding • Steady Hands Admin</title><link rel="stylesheet" href="styles.css"><script src="https://unpkg.com/lucide@latest"></script><script src="theme.js"></script></head><body class="page-admin-users"><div class="app"><header class="topbar"><div class="topbar-row"><div><span class="admin-kicker">STEADY HANDS ADMIN</span><h1>Onboarding</h1><p class="client-header-sub">Review employee onboarding and reset an individual employee's progress.</p></div></div></header><main class="content admin-users-content"><section class="admin-user-toolbar"><div class="admin-user-search"><i data-lucide="search"></i><input id="onboardingSearch" placeholder="Search name, email or role" type="search"></div><button id="onboardingRefresh" type="button" aria-label="Refresh"><i data-lucide="refresh-cw"></i></button></section><p id="onboardingNotice" role="status">Loading onboarding records…</p><section class="admin-user-list" id="onboardingList"></section></main><nav class="bottom-nav"></nav></div><div id="onboardingDetailOverlay" class="onboard-modal-overlay" hidden><section class="onboard-modal" role="dialog" aria-modal="true" aria-labelledby="onboardingDetailTitle"><header class="onboard-modal-head"><div><h2 id="onboardingDetailTitle">Onboarding details</h2><p id="onboardingDetailSubtitle"></p></div><button type="button" id="onboardingDetailClose" aria-label="Close details">×</button></header><div id="onboardingDetailBody" class="onboard-modal-body"></div></section></div><style>
