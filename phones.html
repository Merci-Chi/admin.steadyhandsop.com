<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#102945" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Steady Hands Admin" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="192x192" href="images/icon-192.png" />
  <title>Phone Numbers • Steady Hands Admin</title>
  <link rel="stylesheet" href="styles.css?v=20261019-admin-voicemail" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="theme.js?v=20261005-account-theme"></script>
<style>
/* Compact phone directory: only number, name and assigned associate by default. */
.page-admin-phones .admin-phone-list{display:grid;gap:8px}
.page-admin-phones .admin-phone-card{padding:12px 14px!important;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 14px}
.page-admin-phones .admin-phone-card-head{margin:0!important;min-width:0;gap:10px}
.page-admin-phones .admin-phone-card-icon{display:none!important}
.page-admin-phones .admin-phone-card-copy{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 12px;min-width:0}
.page-admin-phones .admin-phone-card-copy strong{font-size:14px}
.page-admin-phones .admin-phone-card-copy span,.page-admin-phones .admin-phone-card-copy small{font-size:12px;opacity:.86}
.page-admin-phones .admin-phone-active[hidden],.page-admin-phones .admin-phone-more[hidden]{display:none!important}
.page-admin-phones .admin-phone-compact-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.page-admin-phones .admin-phone-compact-actions button{padding:7px 9px;border-radius:8px;border:1px solid #54718e;background:#18334f;color:#edf5ff;font-size:12px;cursor:pointer}
.page-admin-phones .admin-phone-compact-actions button[data-phone-delete]{color:#ffc7c7;border-color:#8e5260}
.page-admin-phones .admin-phone-compact-actions button:disabled{opacity:.4;cursor:default}
.page-admin-phones .admin-phone-more{grid-column:1/-1;padding-top:12px;border-top:1px solid #36506d}
.page-admin-phones .admin-phone-rename{display:flex;align-items:flex-end;flex-wrap:wrap;gap:8px;margin:10px 0}
.page-admin-phones .admin-phone-rename label{display:grid;gap:5px;flex:1;min-width:160px}
.page-admin-phones .admin-phone-rename input{padding:9px;border-radius:8px;min-width:0}
.page-admin-phones .admin-phone-rename button{padding:10px;border-radius:8px;cursor:pointer}
@media(max-width:650px){.page-admin-phones .admin-phone-card{grid-template-columns:1fr}.page-admin-phones .admin-phone-compact-actions{justify-content:flex-start}}

/* Phone directory readability: reserve full-width lines for number and assignee. */
.page-admin-phones .admin-phone-card{grid-template-columns:minmax(0,1fr)!important;align-items:stretch!important;gap:12px!important;padding:16px 18px!important}
.page-admin-phones .admin-phone-card-head{display:block!important;width:100%;min-width:0!important}
.page-admin-phones .admin-phone-card-copy{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:5px!important;align-items:start!important;width:100%;min-width:0!important}
.page-admin-phones .admin-phone-card-copy strong{display:block;font-size:17px!important;font-weight:800;line-height:1.3;white-space:normal;overflow-wrap:normal;word-break:normal}
.page-admin-phones .admin-phone-card-copy span{display:block;font-size:12px!important;line-height:1.4;overflow-wrap:anywhere}
.page-admin-phones .admin-phone-card-copy small{display:block;font-size:14px!important;font-weight:700;line-height:1.4;color:#d9e7f7;overflow-wrap:anywhere}
.page-admin-phones .admin-phone-card-copy small::before{content:'Assigned: ';font-size:12px;font-weight:500;color:#9eb4ce}
.page-admin-phones .admin-phone-card-copy small:empty::before{content:''}
.page-admin-phones .admin-phone-compact-actions{justify-content:flex-end!important;gap:8px!important;width:100%}
.page-admin-phones .admin-phone-compact-actions button{flex:0 0 auto;white-space:nowrap}
@media(max-width:480px){.page-admin-phones .admin-phone-card{padding:14px!important}.page-admin-phones .admin-phone-compact-actions{justify-content:flex-start!important}}
</style>
</head>
<body class="page-admin-phones">
<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div>
        <span class="admin-kicker">SALES ASSOCIATES</span>
        <h1>Phone Numbers</h1>
      </div>
    </div>
  </header>

  <section class="admin-phone-policy-action" style="padding:16px 20px;background:#102945">
    <button type="button" id="openCallingPolicies" style="padding:13px 18px;background:#1674d1;border:0;color:white;border-radius:12px;font-weight:800;cursor:pointer">Assign Delay / Calling Access</button>
  </section>
  <div id="callingPoliciesOverlay" hidden style="position:fixed;inset:0;z-index:10000;background:rgba(0,9,25,.78);overflow:auto;padding:24px 12px;box-sizing:border-box">
    <section style="max-width:560px;margin:20px auto;background:#12243b;color:#eef5ff;padding:24px;border-radius:20px;border:1px solid #416080">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <h2 style="margin:0;color:inherit">Associate Calling Controls</h2>
        <button type="button" id="closeCallingPolicies" aria-label="Close calling controls" style="background:transparent;color:inherit;border:1px solid #57718d;border-radius:9px;padding:8px 12px;cursor:pointer">Close</button>
      </div>
      <p>Set a visible call preparation delay or restrict outbound calling for an Outreach user.</p>
      <form id="adminCallingForm" style="display:grid;gap:14px">
        <label>Outreach user<select id="policyAssociate" required><option value="">Loading associates…</option></select></label>
        <label>Calling mode<select id="policyMode"><option value="normal">Normal calling</option><option value="delayed">Assign Delay</option><option value="restricted">Restrict Calling</option></select></label>
        <div id="policyDelayFields" hidden style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
          <label>Minimum seconds<input id="policyMin" type="number" min="7" max="45" value="7" required></label>
          <label>Maximum seconds<input id="policyMax" type="number" min="7" max="45" value="45" required></label>
          <label style="grid-column:1/-1">Random distribution<select id="policyBias"><option value="high">Mostly slower</option><option value="medium">Somewhat slower</option><option value="even">Even random</option></select></label>
        </div>
        <button type="submit" style="padding:12px;border-radius:10px;border:0;background:#1674d1;color:white;font-weight:800;cursor:pointer">Save Calling Policy</button>
        <p id="policyResult" role="status"></p>
      </form>
    </section>
  </div>
  <style>
    #callingPoliciesOverlay[hidden],#policyDelayFields[hidden]{display:none!important}
    #callingPoliciesOverlay label{display:grid;gap:7px;font-weight:700}
    #callingPoliciesOverlay select,#callingPoliciesOverlay input{min-width:0;width:100%;box-sizing:border-box;padding:11px;border:1px solid #6385a4;border-radius:9px;background:#1c3552;color:#fff}
  </style>
  <main class="content admin-settings-content" id="adminSettingsContent">
    <section class="admin-access-denied">
      <div class="admin-access-icon"><i data-lucide="loader-circle"></i></div>
      <h2>Loading phone management…</h2>
      <p>Checking phone requests, caller IDs, and assignments.</p>
    </section>
  </main>

  <nav class="bottom-nav"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js?v=20261005-admin-only"></script>
<script src="admin-shell.js?v=20261019-performance"></script>
<script src="admin-settings.js?v=20261019-admin-voicemail"></script>
<script src="admin-calling-policies.js?v=20261020-all-outreach-v2"></script>
<script>
(() => {
  const overlay=document.getElementById('callingPoliciesOverlay');
  document.getElementById('openCallingPolicies').addEventListener('click',()=>{overlay.hidden=false;});
  document.getElementById('closeCallingPolicies').addEventListener('click',()=>{overlay.hidden=true;});
  overlay.addEventListener('click',event=>{if(event.target===overlay)overlay.hidden=true;});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')overlay.hidden=true;});
})();
</script>
</body>
</html>
