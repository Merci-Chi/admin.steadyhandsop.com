<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#102945" />
  <meta name="apple-mobile-web-app-title" content="Steady Hands Admin" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="192x192" href="images/icon-192.png" />
  <title>Phone Numbers • Steady Hands Admin</title>
  <link rel="stylesheet" href="styles.css?v=20261005-admin-batch7" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="theme.js?v=20261005-account-theme"></script>
</head>
<body class="page-admin-phones">
<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div>
        <span class="admin-kicker">STEADY HANDS ADMIN</span>
        <h1>Phone Numbers</h1>
      </div>
    </div>
  </header>

  <main class="content admin-phones-content">
    <section class="admin-phones-summary" id="adminPhonesSummary"></section>

    <section class="admin-dashboard-section">
      <div class="admin-dashboard-head">
        <div><span class="admin-kicker">REQUESTS</span><h2>Pending Phone Requests</h2></div>
        <span class="admin-list-count" id="adminPhoneRequestCount">0</span>
      </div>
      <div class="admin-phone-request-list" id="adminPhoneRequestList"><div class="cc-empty">Loading requests…</div></div>
    </section>

    <section class="admin-dashboard-section">
      <div class="admin-dashboard-head">
        <div><span class="admin-kicker">OUTBOUND NUMBERS</span><h2>Caller IDs</h2></div>
      </div>

      <form class="admin-phone-add-form" id="adminPhoneAddForm">
        <label>
          <span>Phone number</span>
          <input id="adminPhoneNumber" type="tel" inputmode="tel" placeholder="+17025550101" required />
        </label>
        <label>
          <span>Label</span>
          <input id="adminPhoneLabel" type="text" maxlength="60" placeholder="Sales Line 1" />
        </label>
        <button type="submit"><i data-lucide="plus"></i>Add Pending Number</button>
      </form>

      <div class="admin-phone-number-list" id="adminPhoneNumberList"><div class="cc-empty">Loading phone numbers…</div></div>
    </section>
  </main>

  <nav class="bottom-nav"></nav>
</div>

<div class="admin-phone-drawer-overlay" id="adminPhoneDrawerOverlay" hidden>
  <aside class="admin-phone-drawer" id="adminPhoneDrawer"></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js?v=20261005-admin-only"></script>
<script src="admin-shell.js?v=20261005-batch7"></script>
<script src="admin-phones.js?v=20261005-batch7"></script>
</body>
</html>
