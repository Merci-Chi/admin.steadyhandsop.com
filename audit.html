<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#102945" />
  <meta name="apple-mobile-web-app-title" content="Steady Hands Admin" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="192x192" href="images/icon-192.png" />
  <title>Audit Log • Steady Hands Admin</title>
  <link rel="stylesheet" href="styles.css?v=20261009-dark-text-popup-v8" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="theme.js?v=20261005-account-theme"></script>
</head>
<body class="page-admin-audit">
<div class="app">
  <header class="topbar"><div class="topbar-row"><div><span class="admin-kicker">STEADY HANDS ADMIN</span><h1>Audit Log</h1></div></div></header>
  <main class="content admin-audit-content">
    <section class="admin-audit-toolbar">
      <div class="admin-user-search"><i data-lucide="search"></i><input id="adminAuditSearch" type="search" placeholder="Search actor, table, action, record…" autocomplete="off" /></div>
      <select id="adminAuditAction"><option value="">All actions</option><option value="INSERT">Created</option><option value="UPDATE">Updated</option><option value="DELETE">Deleted</option></select>
      <select id="adminAuditTable"><option value="">All areas</option></select>
    </section>
    <section class="admin-audit-summary" id="adminAuditSummary"></section>
    <section class="admin-dashboard-section">
      <div class="admin-dashboard-head"><div><span class="admin-kicker">SYSTEM HISTORY</span><h2>Administrative Changes</h2></div><span class="admin-list-count" id="adminAuditCount">0</span></div>
      <div class="admin-audit-list" id="adminAuditList"><div class="cc-empty">Loading audit log…</div></div>
    </section>
  </main>
  <nav class="bottom-nav"></nav>
</div>
<div class="admin-audit-drawer-overlay" id="adminAuditDrawerOverlay" hidden><aside class="admin-audit-drawer" id="adminAuditDrawer"></aside></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js?v=20261005-admin-only"></script>
<script src="admin-shell.js?v=20261009-independent-scroll-v3"></script>
<script src="admin-audit.js?v=20261005-batch8"></script>
</body>
</html>
